schema_version: 1

project:
  name: Agent Development Starter
  repository: agent-dev-starter
  abbreviation: ADS
  type: development-starter
  lifecycle: maintenance

purpose:
  summary: >-
    Standardize repository-driven development workflows for AI coding agents.
  problem: >-
    AI-assisted projects lose durable context when project intent, architecture,
    and working state exist only in prompts or conversation history.

supported_agents:
  initial:
    - codex
    - claude-code
  policy: agent-agnostic-core
  entrypoint: AGENTS.md   # sole adapter for every supported agent — see ADR-0011

principles:
  - repository-first-context
  - agent-agnostic-core
  - explicit-architecture-decisions
  - minimal-task-prompts
  - evidence-before-change
  - standards-over-reinvention
  - deterministic-quality-gates-when-implemented

current_phase:
  id: v2-standards-aligned
  status: active
  goal: >-
    Migrated onto open standards (AGENTS.md, GitHub Spec Kit, Agent Skills)
    instead of ADS's own reimplementations. See docs/status/current-state.md.

standards:
  agents_md: AGENTS.md
  spec_kit:
    pinned_version: specify-cli==1.0.8   # see ADR-0010; bump only via a new ADR
    memory: .specify/memory/
  skills:
    claude_code: .claude/skills/
    codex: .agents/skills/

context:
  human_entrypoint: README.md
  agent_entrypoint: AGENTS.md
  specify_constitution: .specify/memory/constitution.md
  documentation_policy: .ai/constitution/documentation-policy.md
  product: docs/product/
  architecture: docs/architecture/
  guides: docs/guides/
  decisions: docs/decisions/
  current_state: docs/status/current-state.md

delivery:
  implementation_present: false
  cli_present: false
  automation_present: false
